[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fernme"
version = "0.4.3"
description = "FERNme - a user-owned memory layer for AI agents: zero-LLM deterministic core with optional human-approved enrichment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mirkomil Sharipov" }]
maintainers = [{ name = "Acquilab Inc." }]
keywords = ["llm", "agent", "memory", "hebbian", "spreading-activation", "personalization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=1.24", "tiktoken>=0.5", "mcp>=1.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mcp = ["mcp>=1.0,<3"]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
viz = ["matplotlib>=3.7"]
# FERNmark (document conversion) is not on PyPI, and PyPI refuses packages whose
# dependencies point at a git URL, so it is installed directly (see README).
media = ["Pillow>=10"]
# Meaning search across wording and languages (fernme.semantic); then run `fernme-model fetch`.
semantic = ["onnxruntime>=1.17", "tokenizers>=0.15"]
dev = ["pytest>=7.4", "httpx>=0.27", "tomli>=2.0; python_version < '3.11'"]
# Postgres-backed tests only; pgserver has no Windows wheel, so it's gated by platform
# and test_postgres.py skips automatically when these aren't installed.
pgtest = ["psycopg[binary]>=3.1", "pgserver>=0.1; sys_platform != 'win32'"]

[project.scripts]
fernme-mcp = "fernme.api.mcp_server:main"
fernme-ui = "fernme.api.serve:main"
fernme-migrate = "fernme.store.migrate:main"
fernme-model = "fernme.semantic:main"

[project.urls]
Homepage = "https://fernme.dev"
Repository = "https://github.com/mirkofr/FERNme"
Documentation = "https://fernme.dev"

[tool.setuptools.packages.find]
include = ["fernme*"]
exclude = ["fernme.web.app*"]
namespaces = false

[tool.setuptools.package-data]
fernme = [
  "web/static/*.js",
  "web/static/app/*",
  "web/static/app/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
